# SonarQube configuration (started in Week 1, completed in Week 6).
# Run from the repository root after generating coverage:
#   cd backend;  npm run test:coverage;  cd ..
#   cd frontend; npm run test:coverage;  cd ..
#   sonar-scanner   (or: npx sonarqube-scanner)
sonar.projectKey=cohort-10-mern-18539-haiqa
sonar.projectName=Leafnote (MERN)
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src/tests,frontend/src/tests
sonar.test.inclusions=backend/src/tests/**/*.js,frontend/src/tests/**/*.js,frontend/src/tests/**/*.jsx
sonar.exclusions=**/tests/**,**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.js,**/*.config.cjs,frontend/src/assets/**
sonar.coverage.exclusions=backend/src/server.js,frontend/src/main.jsx,frontend/src/tests/**,backend/src/tests/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
